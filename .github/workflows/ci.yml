name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Runtime files (included, so not reached by cargo fmt)
        run: rustfmt --check --edition 2024 --config-path rustfmt.toml crates/kalinga-codegen/runtime/*.rs
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install macroquad's system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - name: Unit, UI, docs, CLI and utkal tests
        run: cargo test --workspace
      - name: Tests that download crates
        run: cargo test --workspace -- --ignored --skip game_window_smoke
      - name: The games build (std/game, main-thread start-up)
        run: |
          cargo run --quiet --bin kalinga -- build examples/pong/main.kl -o pong-ci${{ runner.os == 'Windows' && '.exe' || '' }}
          cargo run --quiet --bin kalinga -- build examples/asteroids/main.kl -o asteroids-ci${{ runner.os == 'Windows' && '.exe' || '' }}

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
