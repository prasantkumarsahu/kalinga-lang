name: Release

# Pushing a tag `vX.Y.Z` builds `kalinga` and `utkal` for Windows, Linux and macOS and the
# VS Code extension, and publishes them as a GitHub release whose notes are the tag's
# CHANGELOG section, and publishes the extension to the VS Code Marketplace (with the
# `VSCE_PAT` secret; a version already there is skipped). Running it by hand (Actions → Release → Run workflow) on any branch,
# or a pull request that changes this file, builds everything as artifacts and publishes
# nothing.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, archive: tar.gz }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Version (a tag must match Cargo.toml)
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kalinga-lang") | .version')
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($version)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --bins --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="kalinga-$VERSION-${{ matrix.target }}"
          exe=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then exe=".exe"; fi
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/kalinga$exe" "target/${{ matrix.target }}/release/utkal$exe" "$name/"
          cp README.md LICENSE CHANGELOG.md "$name/"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kalinga-${{ matrix.target }}
          path: kalinga-*.${{ matrix.archive }}
          if-no-files-found: error

  vsix:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: editors/vscode/*.vsix
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [build, vsix]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from the CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The lines after `## <version>` up to the next `## `.
          awk -v v="$version" 'index($0, "## " v) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          # Links into the repository work from the release page too.
          sed -i "s#](docs/#](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/#g" notes.md
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Kalinga ${GITHUB_REF_NAME#v}" --notes-file notes.md
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish the extension to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -z "$VSCE_PAT" ]]; then
            echo "::warning::no VSCE_PAT secret: the extension was not published to the Marketplace"
            exit 0
          fi
          # The exact .vsix attached to the release; a version already published is skipped.
          npx --yes @vscode/vsce@3.6.2 publish --packagePath dist/kalinga-lang-*.vsix --skip-duplicate
