[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
toml = "1.1.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# The `kalinga` and `utkal` commands, and the end-to-end tests.
[package]
name = "kalinga-lang"
description = "Kalinga: a simple, safe, object-oriented language that compiles to Rust"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kalinga-driver = { path = "crates/kalinga-driver" }
kalinga-project = { path = "crates/kalinga-project" }
toml = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "kalinga"
path = "src/main.rs"

[[bin]]
name = "utkal"
path = "src/bin/utkal.rs"
