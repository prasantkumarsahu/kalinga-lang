[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
toml = "1.1.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
# Long functions are split into named steps; the limit is in clippy.toml.
too_many_lines = "warn"

# The `kalinga` and `utkal` commands, and the end-to-end tests.
[package]
name = "kalinga-lang"
description = "Kalinga: a simple, safe, object-oriented language that compiles to Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
# `cargo run -- run file.kl` runs the compiler (`utkal` with `--bin utkal`).
default-run = "kalinga"

[dependencies]
kalinga-driver = { path = "crates/kalinga-driver" }
kalinga-lsp = { path = "crates/kalinga-lsp" }
kalinga-project = { path = "crates/kalinga-project" }
toml = { workspace = true }

[dev-dependencies]
kalinga-fmt = { path = "crates/kalinga-fmt" }
kalinga-sema = { path = "crates/kalinga-sema" }
serde_json = "1"

[lints]
workspace = true

[[bin]]
name = "kalinga"
path = "src/main.rs"

[[bin]]
name = "utkal"
path = "src/bin/utkal.rs"
